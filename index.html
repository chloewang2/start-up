<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nespresso : The Art of Coffee</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="banner">
    <div class="container">
      <h1>The Ultimate Coffee Experience</h1>
      <h2>Unforgettable taste</h2>
      <a href="#" class="btn-blue">Explore the vast range of coffee</a>
    </div>
  </div>

  <div class="container">
    <h2 style="margin-top: 50px;">Find your blend
    </h2>
  </div>
    
  <div class="cards">
    <div class="card">
      <img src="images/capsule-1.jpg" alt="Napoli">
      <h3>Ispirazione Napoli</h3>
    </div>

    <div class="card">
      <img src="images/capsule-2.jpg" alt="Arpeggio">
      <h3>Ispirazione Frienze Arpeggio</h3>
    </div>

    <div class="card">
      <img src="images/capsule-3.jpg" alt="Volluto">
      <h3>Volluto</h3>
    </div>

  </div>

  <div class="typeform-section">
  <div class="container">
    <h2>Join the Nespresso Club</h2>
    <p style="margin-bottom: 20px;">Subscribe to receive exclusive offers and new coffees.</p>
    
    <form class="nespresso-form">
      <input type="text" placeholder="Full Name" required>
      
      <input type="email" placeholder="Email Address (e.g. name@coffee.com)" required>
      
      <input type="text" placeholder="Your favorite coffee blend">
      
      <a href="#" class="btn-submit">JOIN THE CLUB</a>
    </form>
  </div>
</div>

</body>
</html>
